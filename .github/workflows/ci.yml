name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript and lint check
        run: npm run lint

      - name: Automated tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Validate Docker image
        run: docker build -t exepts:ci .
