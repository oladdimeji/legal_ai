name: CI and Deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript and lint check
        run: npm run lint

      - name: Automated tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Validate Docker image
        run: docker build -t exepts:ci .

  deploy:
    name: Deploy to Ubuntu
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://exepts.com

    concurrency:
      group: exepts-production
      cancel-in-progress: false

    steps:
      - name: Configure deployment SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy Exepts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" '
            set -eu

            export HOME=/home/exepts
            cd /home/exepts/exepts-app

            echo "Pulling latest main branch..."
            git pull --ff-only origin main

            echo "Building and starting Exepts..."
            docker compose -f compose.yaml up -d --build

            echo "Waiting for Exepts health check..."
            attempts=0

            until curl --fail --silent \
              http://127.0.0.1:3004/api/health \
              >/dev/null; do

              attempts=$((attempts + 1))

              if [ "$attempts" -ge 12 ]; then
                echo "Exepts failed its health check."
                docker compose -f compose.yaml ps
                docker compose -f compose.yaml logs --tail=100
                exit 1
              fi

              sleep 5
            done

            echo "Exepts deployment succeeded."
            docker compose -f compose.yaml ps
            git log -1 --format="%h %ci %s"
          '