services:
  app:
    build:
      context: .
    image: exepts:local
    env_file:
      - .env
    environment:
      NODE_ENV: production
    ports:
      - "${PORT:-3004}:${PORT:-3004}"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + (process.env.PORT || '3004') + '/api/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
