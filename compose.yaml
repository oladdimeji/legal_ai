services:
  app:
    build:
      context: .
      args:
        VITE_GOOGLE_DRIVE_CLIENT_ID: ${VITE_GOOGLE_DRIVE_CLIENT_ID}
        VITE_GOOGLE_DRIVE_API_KEY: ${VITE_GOOGLE_DRIVE_API_KEY}
        VITE_GOOGLE_DRIVE_APP_ID: ${VITE_GOOGLE_DRIVE_APP_ID}
        VITE_DROPBOX_APP_KEY: ${VITE_DROPBOX_APP_KEY}

    image: exepts:local

    env_file:
      - .env

    environment:
      NODE_ENV: production

    ports:
      - "127.0.0.1:${PORT:-3004}:${PORT:-3004}"

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + (process.env.PORT || '3004') + '/api/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s